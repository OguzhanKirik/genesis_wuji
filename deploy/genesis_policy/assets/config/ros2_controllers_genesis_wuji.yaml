    joints:
      - waistRoll
      - waistPitch
      - waistYaw
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    # Carried from the arms; not yet swept at the worst waistPitch load.
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.05
      waistRoll: {goal: 0.10}
      waistPitch: {goal: 0.10}
      waistYaw: {goal: 0.10}

