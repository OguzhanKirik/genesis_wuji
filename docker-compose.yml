services:
  # One environment for everything: Isaac Sim 6.0 / Isaac Lab 3.0 trains AND
  # renders. Bring it up, exec in, run what you need.
  #
  #     docker compose up -d
  #     docker compose exec adam_rl bash
  #
  #     # headless training (omit --viz)
  #     python adam_u_rl/scripts/train.py --num_envs 4096
  #     # train with the RTX viewport open
  #     python adam_u_rl/scripts/train.py --viz kit --num_envs 16
  #     # watch a trained policy
  #     python adam_u_rl/scripts/play.py --viz kit --num_envs 4 --real-time \
  #         --checkpoint_path logs/rsl_rl/adam_u30_grasp/<run>/model_N.pt
  #     # sanity-check the robot spawns upright
  #     python /opt/tools/compare_pose.py
  #
  # For the GUI, once per login on the host:  xhost +local:root
  # RTX-free alternatives if kit ever regresses:  --viz rerun  |  --viz viser
  adam_rl:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ISAACLAB30_REV: ${ISAACLAB30_REV:-28a37cecdd433c22d9eabd6a5954add9f13a8951}
    image: adam-u-rl:isaaclab-3.0
    container_name: adam_rl
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      - OMNI_KIT_ACCEPT_EULA=YES
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY:-:1}
      - NVIDIA_DRIVER_CAPABILITIES=all
      # torch 2.10.0+cu128 ships sm_120 (Blackwell). Keep aligned with the real
      # card or any source build silently targets the wrong architecture.
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-12.0}
    volumes:
      # The whole checkout, live: host edits take effect with no rebuild, and
      # logs/ lands back on the host.
      - ./adam_u_isaac_lab:/workspace
      # tools/ mounted so the diagnostics track the repo without a rebuild.
      - ./tools:/opt/tools:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Isaac Sim's extension and shader caches. Without these, every start
      # re-downloads extensions and rebuilds shaders -- minutes each time, and
      # 6.0's first shader build looks like a hang.
      - isaac60-cache-kit:/opt/venv/lib/python3.12/site-packages/isaacsim/kit/cache
      - isaac60-cache-ov:/root/.cache/ov
      - isaac60-cache-nvidia:/root/.nv
      - isaac60-data:/root/.local/share/ov/data
      - isaac60-logs:/root/.nvidia-omniverse/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # PhysX and Isaac Sim need far more than Docker's 64 MB default; the errors
    # it produces otherwise never mention shared memory.
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  isaac60-cache-kit:
  isaac60-cache-ov:
  isaac60-cache-nvidia:
  isaac60-data:
  isaac60-logs:
