# genesis_rl CI: the deploy packages' host tests on every push and pull request, and the deploy image
# (deploy/Dockerfile on adam-moveit's release image) on tags v* and on manual dispatch. Mirrors adam-moveit's
# ci.yml/release.yml: amd64 on GitHub's runner, arm64 (the Jetson Thor) when the repository variable
# ARM64_RUNNER names a runner (ubuntu-24.04-arm or a self-hosted label). Images go to
# ghcr.io/<owner>/genesis-rl-deploy:<tag>-<arch> plus a multi-arch manifest ghcr.io/<owner>/genesis-rl-deploy:<tag>.
# ADAM_IMAGE_TAG (repository variable, default v0.4.0) picks the adam-moveit base image. Pulling that private
# base needs either the genesis_rl repository granted read access on the adam-moveit package, or the secrets
# GHCR_PULL_USER / GHCR_PULL_TOKEN (a token with read:packages AND write:packages, since the same login pushes).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      adam_image_tag:
        description: adam-moveit release tag to build on (overrides the ADAM_IMAGE_TAG variable)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: host tests (perception, policy level/selector/pregrasp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "numpy<2" scipy pyyaml pytest
      - name: genesis_perception
        run: cd deploy/genesis_perception && python -m pytest test -q
      - name: genesis_policy (the tests that need no ROS or pinocchio)
        run: cd deploy/genesis_policy && python -m pytest test/test_level.py test/test_selector.py test/test_pregrasp.py -q
      - name: compile the Isaac-side tools
        run: python -m py_compile tools/render_rod_dataset.py tools/export_policy.py

  prepare:
    name: image tag and architecture matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
      adam_tag: ${{ steps.vars.outputs.adam_tag }}
      matrix: ${{ steps.vars.outputs.matrix }}
    steps:
      - id: vars
        env:
          ARM64_RUNNER: ${{ vars.ARM64_RUNNER }}
          ADAM_TAG_VAR: ${{ vars.ADAM_IMAGE_TAG }}
          ADAM_TAG_INPUT: ${{ github.event.inputs.adam_image_tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/genesis-rl-deploy" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="sha-${GITHUB_SHA:0:7}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "adam_tag=${ADAM_TAG_INPUT:-${ADAM_TAG_VAR:-v0.4.0}}" >> "$GITHUB_OUTPUT"
          amd64='{"arch":"amd64","runner":"ubuntu-24.04","platform":"linux/amd64"}'
          if [ -n "$ARM64_RUNNER" ]; then
            arm64='{"arch":"arm64","runner":"'"$ARM64_RUNNER"'","platform":"linux/arm64"}'
            echo "matrix={\"include\":[$amd64,$arm64]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ARM64_RUNNER is not set: amd64 only. Set it to ubuntu-24.04-arm or a self-hosted arm64 label for the Jetson Thor image."
            echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"
          fi

  deploy-image:
    name: deploy image (${{ matrix.arch }})
    needs: [tests, prepare]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
      ADAM_TAG: ${{ needs.prepare.outputs.adam_tag }}
      # Where the adam-moveit base comes from, decided by what the repository holds:
      #  - secret ADAM_MOVEIT_DEPLOY_KEY (a read-only deploy key on adam-moveit): check adam-moveit out at
      #    variable ADAM_MOVEIT_REF and build its `deploy` target here (BASE_IMAGE=ubuntu:24.04, the same recipe
      #    as adam-moveit's own release and the Jetson Thor), then build this image on top. Needs no package
      #    access at all. ~20-30 min per architecture.
      #  - otherwise pull ghcr.io/<owner>/adam-moveit:<ADAM_IMAGE_TAG>: the package is private and scoped to
      #    adam-moveit, so either the genesis_rl repository has been granted read access on it (package settings
      #    -> Manage Actions access) or the secret GHCR_PULL_TOKEN (read:packages) is set.
      BUILD_BASE_FROM_SOURCE: ${{ secrets.ADAM_MOVEIT_DEPLOY_KEY != '' && secrets.GHCR_PULL_TOKEN == '' }}
      ADAM_MOVEIT_REF: ${{ vars.ADAM_MOVEIT_REF || 'main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USER || github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Free runner disk (the ROS layer plus the deploy image need ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: The exported policies the image ships
        run: |
          # handoff/policy is not in git (checkpoints are exported on the training machine); the image needs
          # the directory, so an empty one is created when it is missing and the robot mounts a real set.
          mkdir -p handoff/policy && ls handoff/policy
      - name: Check out adam-moveit (deploy key)
        if: env.BUILD_BASE_FROM_SOURCE == 'true'
        uses: actions/checkout@v5
        with:
          repository: REVEL-Robotics/adam-moveit
          ref: ${{ env.ADAM_MOVEIT_REF }}
          ssh-key: ${{ secrets.ADAM_MOVEIT_DEPLOY_KEY }}
          path: adam-moveit
      - name: Build the adam-moveit base from source
        if: env.BUILD_BASE_FROM_SOURCE == 'true'
        run: |
          cd adam-moveit
          echo "adam-moveit $(git rev-parse --short HEAD) -> adam-moveit-base:local (deploy target, ubuntu:24.04)"
          DOCKER_BUILDKIT=1 docker build --target deploy --build-arg BASE_IMAGE=ubuntu:24.04 \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" -t adam-moveit-base:local .
          docker builder prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Build and push the deploy image
        run: |
          if [ "$BUILD_BASE_FROM_SOURCE" = "true" ]; then
            base=adam-moveit-base:local
            base_ref="adam-moveit@$ADAM_MOVEIT_REF (built from source)"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            base="ghcr.io/${owner}/adam-moveit:${ADAM_TAG}"
            base_ref="$base"
          fi
          echo "base: $base_ref"
          DOCKER_BUILDKIT=1 docker build -f deploy/Dockerfile --build-arg BASE_IMAGE="$base" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.base.name=$base_ref" \
            -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  manifest:
    name: publish the multi-arch tag
    needs: [prepare, deploy-image]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          members=$(echo "$MATRIX" | python3 -c 'import json,sys,os; m=json.load(sys.stdin); print(" ".join(f"{os.environ[\"IMAGE\"]}:{os.environ[\"TAG\"]}-{i[\"arch\"]}" for i in m["include"]))')
          docker buildx imagetools create -t "$IMAGE:$TAG" $members
          docker buildx imagetools inspect "$IMAGE:$TAG"
